[project]
name = "galaxy-manifold-viz"
version = "0.1.0"
description = "Data pipeline for the Galaxy Manifold site (site/ itself has no Python)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18",
    "scipy>=1.11",
    "astropy>=6.1",
    # thumbnails are JPEG-encoded by Pillow, so its version (and bundled libjpeg) sets their bytes
    "pillow==11.1.0",
    "requests>=2.32",
    # thumbs.py select clusters with MiniBatchKMeans; the committed set came from 1.2.2
    "scikit-learn>=1.3",
    # quicklook PNGs in pipeline/cache only
    "matplotlib>=3.8",
]

[tool.uv]
package = false
